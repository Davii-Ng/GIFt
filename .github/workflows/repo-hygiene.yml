name: Repo hygiene

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-generated-or-large-files:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # -eo pipefail: a broken check fails instead of passing
    steps:
      - uses: actions/checkout@v4

      - name: Block committed files under data/
        run: |
          tracked=$(git ls-files data/)
          if [ -n "$tracked" ]; then
            echo "::error::data/ holds downloaded/generated files and must not be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Block files over 1 MB
        env:
          MAX_KB: 1024
          # Frozen benchmark split (2.3 MB); cannot be regenerated byte-for-byte.
          ALLOW: '^benchmark/datasets/dataset1/corpus\.jsonl[[:space:]]'
        run: |
          sizes=$(git ls-files -z | xargs -0 du -k --apparent-size)
          big=$(printf '%s\n' "$sizes" \
            | awk -F'\t' -v max="$MAX_KB" '$1 > max {print $2 "\t" $1 " KB"}' \
            | { grep -Ev "$ALLOW" || true; })
          if [ -n "$big" ]; then
            echo "::error::Files over ${MAX_KB} KB. Download or generate them instead, or allowlist with a reason:"
            echo "$big"
            exit 1
          fi
